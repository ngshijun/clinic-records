name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-checks src/ (vue-tsc -b). The generated Supabase types in
      # src/lib/database.types.ts are the schema source of truth here.
      - run: pnpm run typecheck
      # Runs the unit suite, which includes the i18n key-parity / used-key
      # guard (tests/unit/i18n-keys.test.ts) — fails on any unresolved or
      # untranslated message key.
      - run: pnpm run test

  types-drift:
    name: Supabase types drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates types from the live schema and fails if they differ from
      # what's committed (i.e. a migration landed without `pnpm run gen:types`).
      # Skips cleanly until a SUPABASE_ACCESS_TOKEN repo secret is added, so CI
      # is green out of the box.
      - name: Regenerate types and check for drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret not set - skipping drift check."
            echo "Add it under repo Settings - Secrets and variables - Actions to enable."
            exit 0
          fi
          npx supabase gen types typescript --project-id xuovrjstgifzkwyrevht --schema public > src/lib/database.types.ts
          if ! git diff --quiet -- src/lib/database.types.ts; then
            echo "::error::src/lib/database.types.ts is stale. Run 'pnpm run gen:types' and commit the result."
            git --no-pager diff -- src/lib/database.types.ts
            exit 1
          fi
          echo "Generated types match the live schema."
